logger:
  file:
    path: /usr/local/var/log/open5gs/amf.log
  level: info

amf:
  sbi:
    server:
      - address: 0.0.0.0
        port: 7777
    client:
      nrf:
        - uri: http://172.20.0.10:7777
  ngap:
    server:
      - address: 0.0.0.0
  guami:
    - plmn_id:
        mcc: "001"
        mnc: "01"
      amf_id:
        region: 2
        set: 1
        pointer: 1
  tai:
    - plmn_id:
        mcc: "001"
        mnc: "01"
      tac: 1
  plmn_support:
    - plmn_id:
        mcc: "001"
        mnc: "01"
      s_nssai:
        - sst: 1
          sd: ffffff
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Open5GS
  amf_name: open5gs-amf0