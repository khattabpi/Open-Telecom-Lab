# --- NRF Service & Deployment ---
apiVersion: v1
kind: Service
metadata:
  name: open5gs-nrf
  namespace: open5gs
spec:
  ports:
    - port: 7777
      name: sbi
      protocol: TCP
  selector:
    app: open5gs-nrf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-nrf
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open5gs-nrf
  template:
    metadata:
      labels:
        app: open5gs-nrf
    spec:
      containers:
        - name: nrf
          image: gradiant/open5gs:2.8.0
          command: ["open5gs-nrfd", "-c", "/etc/open5gs/nrf.yaml"]
          volumeMounts:
            - name: config-volume
              mountPath: /etc/open5gs/nrf.yaml
              subPath: nrf.yaml
      volumes:
        - name: config-volume
          configMap:
            name: open5gs-config
---
