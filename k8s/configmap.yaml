apiVersion: v1
kind: ConfigMap
metadata:
  name: open5gs-config
  namespace: open5gs
data:
  nrf.yaml: |
    logger:
      level: info
    nrf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777

  amf.yaml: |
    logger:
      level: debug
    amf:
      amf_name: open5gs-amf1
      time:
        t3512:
          value: 540
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-amf.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777
      ngap:
        server:
          - address: 0.0.0.0
            port: 38412
      guami:
        - plmn_id:
            mcc: "602"
            mnc: "03"
          amf_id:
            region: 2
            set: 1
            pointer: 1
        - plmn_id:
            mcc: "602"
            mnc: "04"
          amf_id:
            region: 2
            set: 1
            pointer: 1
      tai:
        - plmn_id:
            mcc: "602"
            mnc: "03"
          tac: 1
        - plmn_id:
            mcc: "602"
            mnc: "04"
          tac: 1
      plmn_support:
        - plmn_id:
            mcc: "602"
            mnc: "03"
          s_nssai:
            - sst: 1
              sd: ffffff
        - plmn_id:
            mcc: "602"
            mnc: "04"
          s_nssai:
            - sst: 1
              sd: ffffff
      security:
        integrity_order: [ NIA2, NIA1, NIA0 ]
        ciphering_order: [ NEA0, NEA1, NEA2 ]

  v-amf.yaml: |
    logger:
      level: debug
    amf:
      amf_name: open5gs-v-amf1
      time:
        t3512:
          value: 540
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-v-amf.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777
      ngap:
        server:
          - address: 0.0.0.0
            port: 38413
      guami:
        - plmn_id:
            mcc: "218"
            mnc: "90"
          amf_id:
            region: 2
            set: 1
            pointer: 1
      tai:
        - plmn_id:
            mcc: "218"
            mnc: "90"
          tac: 1
      plmn_support:
        - plmn_id:
            mcc: "218"
            mnc: "90"
          s_nssai:
            - sst: 1
              sd: ffffff
      security:
        integrity_order: [ NIA2, NIA1, NIA0 ]
        ciphering_order: [ NEA0, NEA1, NEA2 ]

  ausf.yaml: |
    logger:
      level: debug
    ausf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-ausf.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777

  udm.yaml: |
    logger:
      level: debug
    udm:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-udm.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777

  udr.yaml: |
    logger:
      level: debug
    db_uri: mongodb://mongodb:27017/open5gs
    udr:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-udr.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777

  smf.yaml: |
    logger:
      level: debug
    smf:
      info:
        - s_nssai:
            - sst: 1
              sd: ffffff
              dnn:
                - internet
                - ims
          tai:
            - plmn_id:
                mcc: "602"
                mnc: "03"
              tac: 1
            - plmn_id:
                mcc: "602"
                mnc: "04"
              tac: 1
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-smf.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777
      gtpu:
        server:
          - address: 0.0.0.0
      pfcp:
        server:
          - dev: eth0
            port: 8805
        client:
          upf:
            - address: 172.19.0.2
              port: 8805
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
          range:
            - 10.45.0.10-10.45.0.99
          dnn: internet
        - subnet: 10.46.0.0/16
          gateway: 10.46.0.1
          range:
            - 10.46.0.10-10.46.0.99
          dnn: ims
      dns:
        - 8.8.8.8
        - 1.1.1.1

  v-smf.yaml: |
    logger:
      level: debug
    smf:
      info:
        - s_nssai:
            - sst: 1
              sd: ffffff
              dnn:
                - internet
                - ims
          tai:
            - plmn_id:
                mcc: "218"
                mnc: "90"
              tac: 1
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-v-smf.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777
      gtpu:
        server:
          - address: 0.0.0.0
      pfcp:
        server:
          - dev: eth0
            port: 8805
        client:
          upf:
            - address: 172.19.0.2
              port: 8805
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
          range:
            - 10.45.0.100-10.45.0.199
          dnn: internet
        - subnet: 10.46.0.0/16
          gateway: 10.46.0.1
          range:
            - 10.46.0.100-10.46.0.199
          dnn: ims
      dns:
        - 8.8.8.8
        - 1.1.1.1

  upf.yaml: |
    logger:
      level: info
    upf:
      pfcp:
        server:
          # Bind PFCP (N4) to the node IP, not 0.0.0.0. With hostNetwork the UPF
          # shares the node netns; binding 0.0.0.0 advertises a NULL PFCP node_id
          # and sources replies from loopback (127.0.0.1), so the SMF can never
          # keep the association up. An explicit node IP fixes node_id + source.
          - address: 172.19.0.2
            port: 8805
      gtpu:
        server:
          # Advertise 172.19.0.2 as the N3/GTP-U endpoint — the address the host
          # UERANSIM gNB reaches over the kind bridge.
          - address: 172.19.0.2
            port: 2152
      session:
        - subnet: 10.45.0.0/16
          gateway: 10.45.0.1
          dnn: internet
        - subnet: 10.46.0.0/16
          gateway: 10.46.0.1
          dnn: ims

  pcf.yaml: |
    logger:
      level: info
    db_uri: mongodb://mongodb:27017/open5gs
    pcf:
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-pcf.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777

  bsf.yaml: |
    logger:
      level: info
    db_uri: mongodb://mongodb:27017/open5gs
    bsf:
      # The PCF discovers the BSF (nbsf-management) during SM policy setup to
      # bind the UE PDU session to a PCF. Without a BSF the PCF segfaults
      # (exit 139) on "No [nbsf-management:PCF]" and the PDU session hangs.
      sbi:
        server:
          - address: 0.0.0.0
            port: 7777
            advertise: open5gs-bsf.open5gs.svc.cluster.local
        client:
          nrf:
            - uri: http://open5gs-nrf:7777