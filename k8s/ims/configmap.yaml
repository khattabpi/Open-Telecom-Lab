apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-config
  namespace: ims
data:
  init-db.py: |
    import os, sqlite3
    os.makedirs("/etc/kamailio/db", exist_ok=True)
    db_path = "/etc/kamailio/db/kamailio.sqlite"
    con = sqlite3.connect(db_path)
    cur = con.cursor()
    cur.execute('''
    CREATE TABLE IF NOT EXISTS subscriber (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        username VARCHAR(64) DEFAULT '' NOT NULL,
        domain VARCHAR(64) DEFAULT '' NOT NULL,
        password VARCHAR(64) DEFAULT '' NOT NULL,
        email_address VARCHAR(64) DEFAULT '' NOT NULL,
        ha1 VARCHAR(128) DEFAULT '' NOT NULL,
        ha1b VARCHAR(128) DEFAULT '' NOT NULL,
        rpid VARCHAR(128) DEFAULT NULL,
        CONSTRAINT account_idx UNIQUE (username, domain)
    )''')
    cur.execute('''
    CREATE TABLE IF NOT EXISTS acc (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        method VARCHAR(16) DEFAULT '' NOT NULL,
        from_tag VARCHAR(128) DEFAULT '' NOT NULL,
        to_tag VARCHAR(128) DEFAULT '' NOT NULL,
        callid VARCHAR(255) DEFAULT '' NOT NULL,
        sip_code VARCHAR(3) DEFAULT '' NOT NULL,
        sip_reason VARCHAR(128) DEFAULT '' NOT NULL,
        time DATETIME NOT NULL,
        time_attr VARCHAR(32) DEFAULT '',
        caller VARCHAR(128) DEFAULT '',
        callee VARCHAR(128) DEFAULT '',
        src_ip VARCHAR(64) DEFAULT '',
        dst_ip VARCHAR(64) DEFAULT ''
    )''')
    cur.execute('''
    CREATE TABLE IF NOT EXISTS acc_cdrs (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        start_time VARCHAR(32) DEFAULT '' NOT NULL,
        end_time VARCHAR(32) DEFAULT '' NOT NULL,
        duration INTEGER DEFAULT 0 NOT NULL
    )''')
    cur.execute('''
    CREATE TABLE IF NOT EXISTS missed_calls (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        method VARCHAR(16) DEFAULT '' NOT NULL,
        from_tag VARCHAR(128) DEFAULT '' NOT NULL,
        to_tag VARCHAR(128) DEFAULT '' NOT NULL,
        callid VARCHAR(255) DEFAULT '' NOT NULL,
        sip_code VARCHAR(3) DEFAULT '' NOT NULL,
        sip_reason VARCHAR(128) DEFAULT '' NOT NULL,
        time DATETIME NOT NULL,
        caller VARCHAR(128) DEFAULT '',
        callee VARCHAR(128) DEFAULT '',
        src_ip VARCHAR(64) DEFAULT '',
        dst_ip VARCHAR(64) DEFAULT ''
    )''')
    cur.execute('''
    CREATE TABLE IF NOT EXISTS cdrs (
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        callid VARCHAR(255) DEFAULT '' NOT NULL,
        caller VARCHAR(128) DEFAULT '' NOT NULL,
        callee VARCHAR(128) DEFAULT '' NOT NULL,
        from_tag VARCHAR(128) DEFAULT '' NOT NULL,
        to_tag VARCHAR(128) DEFAULT '' NOT NULL,
        start_time VARCHAR(32) DEFAULT '' NOT NULL,
        end_time VARCHAR(32) DEFAULT '' NOT NULL,
        duration INTEGER DEFAULT 0 NOT NULL,
        sip_code VARCHAR(3) DEFAULT '200' NOT NULL,
        sip_reason VARCHAR(128) DEFAULT 'OK' NOT NULL,
        src_ip VARCHAR(64) DEFAULT '' NOT NULL,
        call_type VARCHAR(32) DEFAULT 'Vo5G-SIP' NOT NULL
    )''')
    subscribers = [
        ("ue1", "ims.lab", "password123"),
        ("602030000000001", "ims.lab", "password123"),
        ("ue2", "ims.lab", "password123"),
        ("602040000000002", "ims.lab", "password123"),
        ("ue3", "ims.lab", "password123"),
        ("602030000000003", "ims.lab", "password123"),
        ("ue1", "10.46.0.1", "password123"),
        ("ue2", "10.46.0.1", "password123"),
        ("ue3", "10.46.0.1", "password123")
    ]
    for u, d, p in subscribers:
        cur.execute("INSERT OR REPLACE INTO subscriber (username, domain, password) VALUES (?, ?, ?)", (u, d, p))
    con.commit()
    con.close()
    print("[✓] SQLite subscriber and CDR accounting database initialized at", db_path)

  pcscf.cfg: |
    #!KAMAILIO
    debug=2
    log_stderror=yes
    auto_aliases=no
    listen=udp:10.46.0.1:5060 advertise 10.46.0.1:5060
    listen=udp:172.19.0.2:5060 advertise 172.19.0.2:5060

    alias="ims.lab"
    alias="10.46.0.1"
    alias="172.19.0.2"
    alias="kamailio-pcscf"
    alias="kamailio-pcscf.ims.svc.cluster.local"

    # Module Loading Order: tm before sl/rr/etc.
    loadmodule "tm.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "pv.so"
    loadmodule "maxfwd.so"
    loadmodule "textops.so"
    loadmodule "siputils.so"
    loadmodule "xlog.so"
    loadmodule "sanity.so"
    loadmodule "path.so"
    loadmodule "rtpengine.so"
    loadmodule "ctl.so"
    loadmodule "jsonrpcs.so"

    modparam("rr", "enable_full_lr", 1)
    modparam("rr", "append_fromtag", 1)
    modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:22222")

    request_route {
        force_rport();

        if (!mf_process_maxfwd_header("10")) {
            sl_send_reply("483","Too Many Hops");
            exit;
        }

        if (!sanity_check()) {
            xlog("L_WARN", "P-CSCF: Malformed request from $si:$sp\n");
            exit;
        }

        if (is_method("OPTIONS")) {
            sl_send_reply("200", "OK");
            exit;
        }

        # Handle in-dialog requests
        if (has_totag()) {
            if (loose_route()) {
                if (is_method("BYE")) {
                    xlog("L_INFO", "P-CSCF: Processing BYE dialog teardown, deleting RTPEngine session\n");
                    rtpengine_delete();
                }
                t_relay();
                exit;
            }
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    t_relay();
                    exit;
                }
                exit;
            }
            sl_send_reply("404", "Not Found");
            exit;
        }

        # Initial REGISTER
        if (is_method("REGISTER")) {
            xlog("L_INFO", "P-CSCF: Relaying REGISTER for $fu (Contact: $ct) to I-CSCF\n");
            add_path_received();
            $du = "sip:kamailio-icscf.ims.svc.cluster.local:5060";
            t_relay();
            exit;
        }

        # Initial INVITE
        if (is_method("INVITE")) {
            xlog("L_INFO", "P-CSCF: Relaying initial INVITE from $fu to $ru (Source: $si)\n");
            record_route_preset("10.46.0.1:5060;nat=yes");
            if ($si =~ "^10\.46\.") {
                # Originating leg from UE -> S-CSCF
                if (has_body("application/sdp")) {
                    xlog("L_INFO", "P-CSCF: Offering SDP with RTPEngine for originating INVITE\n");
                    rtpengine_offer("replace-origin replace-session-connection ICE=remove");
                }
                t_on_reply("REPLY_HANDLER");
                $du = "sip:kamailio-scscf.ims.svc.cluster.local:5060";
            } else {
                # Terminating leg from S-CSCF -> UE
                if (has_body("application/sdp")) {
                    xlog("L_INFO", "P-CSCF: Offering SDP with RTPEngine for terminating INVITE\n");
                    rtpengine_offer("replace-origin replace-session-connection ICE=remove");
                }
                t_on_reply("REPLY_HANDLER");
            }
            t_relay();
            exit;
        }

        if (is_method("CANCEL")) {
            rtpengine_delete();
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }

        # Generic forward for other initial methods
        record_route_preset("10.46.0.1:5060;nat=yes");
        if ($si =~ "^10\.46\.") {
            $du = "sip:kamailio-scscf.ims.svc.cluster.local:5060";
        }
        t_relay();
    }

    onreply_route[REPLY_HANDLER] {
        xlog("L_INFO", "P-CSCF: Handling SIP reply $rs $rr (From: $fu, To: $tu)\n");
        if (status =~ "^(180|183|200)$" && has_body("application/sdp")) {
            xlog("L_INFO", "P-CSCF: Answering SDP with RTPEngine on $rs reply\n");
            rtpengine_answer("replace-origin replace-session-connection ICE=remove");
        }
    }

  icscf.cfg: |
    #!KAMAILIO
    debug=2
    log_stderror=yes
    auto_aliases=no
    listen=udp:0.0.0.0:5060 advertise kamailio-icscf.ims.svc.cluster.local:5060

    alias="ims.lab"
    alias="kamailio-icscf"
    alias="kamailio-icscf.ims.svc.cluster.local"

    # Module Loading Order: tm before sl/rr
    loadmodule "tm.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "pv.so"
    loadmodule "maxfwd.so"
    loadmodule "textops.so"
    loadmodule "siputils.so"
    loadmodule "xlog.so"
    loadmodule "sanity.so"
    loadmodule "ctl.so"
    loadmodule "jsonrpcs.so"

    modparam("rr", "enable_full_lr", 1)
    modparam("rr", "append_fromtag", 1)

    request_route {
        force_rport();

        if (!mf_process_maxfwd_header("10")) {
            sl_send_reply("483","Too Many Hops");
            exit;
        }

        if (!sanity_check()) {
            xlog("L_WARN", "I-CSCF: Malformed request from $si:$sp\n");
            exit;
        }

        if (is_method("OPTIONS")) {
            sl_send_reply("200", "OK");
            exit;
        }

        if (has_totag()) {
            if (loose_route()) {
                t_relay();
                exit;
            }
            sl_send_reply("404", "Not Found");
            exit;
        }

        if (is_method("REGISTER")) {
            xlog("L_INFO", "I-CSCF: Relaying REGISTER for $fu to S-CSCF\n");
            $du = "sip:kamailio-scscf.ims.svc.cluster.local:5060";
            t_relay();
            exit;
        }

        if (is_method("INVITE")) {
            xlog("L_INFO", "I-CSCF: Relaying INVITE from $fu to S-CSCF\n");
            $du = "sip:kamailio-scscf.ims.svc.cluster.local:5060";
            t_relay();
            exit;
        }

        $du = "sip:kamailio-scscf.ims.svc.cluster.local:5060";
        t_relay();
    }

  scscf.cfg: |
    #!KAMAILIO
    debug=2
    log_stderror=yes
    auto_aliases=no
    listen=udp:0.0.0.0:5060 advertise kamailio-scscf.ims.svc.cluster.local:5060

    alias="ims.lab"
    alias="kamailio-scscf"
    alias="kamailio-scscf.ims.svc.cluster.local"

    # Module Loading Order: tm before sl/rr/path/dialog/acc
    loadmodule "tm.so"
    loadmodule "sl.so"
    loadmodule "rr.so"
    loadmodule "pv.so"
    loadmodule "maxfwd.so"
    loadmodule "textops.so"
    loadmodule "siputils.so"
    loadmodule "xlog.so"
    loadmodule "sanity.so"
    loadmodule "path.so"
    loadmodule "usrloc.so"
    loadmodule "registrar.so"
    loadmodule "auth.so"
    loadmodule "auth_db.so"
    loadmodule "db_sqlite.so"
    loadmodule "sqlops.so"
    loadmodule "dialog.so"
    loadmodule "acc.so"
    loadmodule "ctl.so"
    loadmodule "jsonrpcs.so"

    modparam("rr", "enable_full_lr", 1)
    modparam("rr", "append_fromtag", 1)
    modparam("usrloc", "db_mode", 0)
    modparam("usrloc", "cseq_delay", 0)
    modparam("auth_db", "db_url", "sqlite:///etc/kamailio/db/kamailio.sqlite")
    modparam("auth_db", "calculate_ha1", 1)
    modparam("auth_db", "password_column", "password")
    modparam("auth_db", "user_column", "username")
    modparam("auth_db", "domain_column", "domain")

    # Phase 4C: Dialog Tracking, ACC & SQLite CDR Accounting
    modparam("sqlops", "sqlcon", "cb=>sqlite:///etc/kamailio/db/kamailio.sqlite")
    modparam("dialog", "db_mode", 0)
    modparam("dialog", "enable_stats", 1)
    modparam("dialog", "dlg_flag", 4)

    modparam("acc", "db_url", "sqlite:///etc/kamailio/db/kamailio.sqlite")
    modparam("acc", "db_flag", 1)
    modparam("acc", "db_missed_flag", 2)
    modparam("acc", "db_table_acc", "acc")
    modparam("acc", "db_table_missed_calls", "missed_calls")
    modparam("acc", "time_mode", 0)
    modparam("acc", "db_extra", "caller=$fu; callee=$ru; src_ip=$si; dst_ip=$du")
    modparam("acc", "cdr_enable", 0)

    request_route {
        force_rport();

        if (!mf_process_maxfwd_header("10")) {
            sl_send_reply("483","Too Many Hops");
            exit;
        }

        if (!sanity_check()) {
            xlog("L_WARN", "S-CSCF: Malformed request from $si:$sp\n");
            exit;
        }

        if (is_method("OPTIONS")) {
            sl_send_reply("200", "OK");
            exit;
        }

        # In-dialog requests
        if (has_totag()) {
            dlg_manage();
            if (is_method("BYE")) {
                setflag(1);
                $var(duration) = $TS - $dlg_var(start_ts);
                sql_query("cb", "INSERT INTO cdrs (callid, caller, callee, from_tag, to_tag, start_time, end_time, duration, sip_code, sip_reason, src_ip, call_type) VALUES ('$dlg_var(callid)', '$dlg_var(caller)', '$dlg_var(callee)', '$dlg_var(from_tag)', '$tt', datetime($dlg_var(start_ts), 'unixepoch', 'localtime'), datetime('now', 'localtime'), $var(duration), '200', 'OK', '$si', 'Vo5G-SIP')", "ra");
                sql_result_free("ra");
                xlog("L_INFO", "S-CSCF: Recorded CDR into SQLite for call $dlg_var(callid) (Duration: $var(duration)s)\n");
            }
            if (loose_route()) {
                record_route_preset("kamailio-scscf.ims.svc.cluster.local:5060");
                t_relay();
                exit;
            }
            if (is_method("ACK")) {
                if (t_check_trans()) {
                    t_relay();
                    exit;
                }
                exit;
            }
            sl_send_reply("404", "Not Found");
            exit;
        }

        # Registration Handling with Authentication
        if (is_method("REGISTER")) {
            xlog("L_INFO", "S-CSCF: Processing REGISTER for $fu (User: $fU, Domain: $fd)\n");
            if (!auth_check("$fd", "subscriber", "1")) {
                xlog("L_INFO", "S-CSCF: Challenging REGISTER from $fu\n");
                auth_challenge("$fd", "0");
                exit;
            }
            xlog("L_INFO", "S-CSCF: Registration authenticated for $fu, saving location...\n");
            save("location");
            exit;
        }

        if (is_method("CANCEL")) {
            if (t_check_trans()) {
                t_relay();
            }
            exit;
        }

        # Initial INVITE handling
        if (is_method("INVITE")) {
            setflag(1);
            setflag(2);
            setflag(4);
            dlg_manage();
            $dlg_var(caller) = $fu;
            $dlg_var(callee) = $ru;
            $dlg_var(callid) = $ci;
            $dlg_var(from_tag) = $ft;
            $dlg_var(src_ip) = $si;
            $dlg_var(start_ts) = $TS;

            xlog("L_INFO", "S-CSCF: Processing INVITE from $fu to $ru (Target User: $rU, Call-ID: $ci)\n");
            record_route_preset("kamailio-scscf.ims.svc.cluster.local:5060");
            
            # Lookup terminating subscriber location
            if (!lookup("location")) {
                xlog("L_WARN", "S-CSCF: Target subscriber $rU not registered in location DB\n");
                sl_send_reply("404", "User Not Found / Not Registered");
                exit;
            }

            xlog("L_INFO", "S-CSCF: Destination found: $du (RU: $ru). Relaying INVITE...\n");
            t_relay();
            exit;
        }

        # Other initial requests (MESSAGE, INFO, etc.)
        if (lookup("location")) {
            record_route_preset("kamailio-scscf.ims.svc.cluster.local:5060");
            t_relay();
            exit;
        }

        sl_send_reply("404", "Not Found");
    }
