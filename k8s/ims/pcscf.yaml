apiVersion: apps/v1
kind: Deployment
metadata:
  name: kamailio-pcscf
  namespace: ims
  labels:
    app: kamailio-pcscf
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kamailio-pcscf
  template:
    metadata:
      labels:
        app: kamailio-pcscf
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: pcscf
          image: ims-node:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              echo "[*] Waiting for ogstun 10.46.0.1 interface..."
              until ip -4 addr show ogstun 2>/dev/null | grep -q "10.46.0.1"; do
                sleep 1
              done
              echo "[✓] ogstun 10.46.0.1 detected. Starting Kamailio P-CSCF..."
              exec kamailio -DD -E -f /etc/kamailio/config/pcscf.cfg
          ports:
            - name: sip-udp
              containerPort: 5060
              protocol: UDP
            - name: sip-tcp
              containerPort: 5060
              protocol: TCP
          volumeMounts:
            - name: config-volume
              mountPath: /etc/kamailio/config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config-volume
          configMap:
            name: ims-config
---
apiVersion: v1
kind: Service
metadata:
  name: kamailio-pcscf
  namespace: ims
  labels:
    app: kamailio-pcscf
spec:
  type: ClusterIP
  selector:
    app: kamailio-pcscf
  ports:
    - name: sip-udp
      port: 5060
      targetPort: 5060
      protocol: UDP
    - name: sip-tcp
      port: 5060
      targetPort: 5060
      protocol: TCP
