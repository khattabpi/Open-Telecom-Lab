# UERANSIM UE3 Configuration (Roaming Subscriber: Egypt Home PLMN in Bosnia Visited PLMN)
# Open Telecom Lab — v3.0
# Reference: 3GPP TS 24.501 / TS 33.501 / TS 23.122

# ─── Subscriber Identity ───────────────────────────────────────
# Egyptian Home Subscriber
supi: 'imsi-602030000000003'

# Home PLMN (Egypt — HPLMN 602/03)
mcc: '602'
mnc: '03'

# Roaming Visited PLMN (Bosnia and Herzegovina — VPLMN 218/90 / BH Telecom)
vplmn:
  mcc: '218'
  mnc: '90'

# SUCI Protection (0 = Null scheme — no encryption of SUPI)
protectionScheme: 0
homeNetworkPublicKey: '5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650'
homeNetworkPublicKeyId: 1
routingIndicator: '0000'

# ─── Authentication Credentials ────────────────────────────────
# Permanent subscription key (K) — matches Home UDM/MongoDB subscriber
key: '465B5CE8B199B49FAA5F0A2EE238A6BE'

# Operator Code (OPc) — matches Home UDM/MongoDB subscriber
op: 'E8ED2441347B7990E92C19B0316CD6FC'
opType: 'OPC'

# Authentication Management Field
amf: '8000'

# ─── Device Identity ───────────────────────────────────────────
imei: '356938035643805'
imeiSv: '4370816125816153'

# ─── Network Interface ─────────────────────────────────────────
tunNetmask: '255.255.0.0'

# Use Linux network namespace for UE traffic isolation
useNamespace: true
nsNamePrefix: 'ueransim'

# ─── RAN Connection (Attach to gNodeB-Visited ONLY) ────────────
gnbSearchList:
  - 127.0.0.2

# ─── UAC Configuration ─────────────────────────────────────────
uacAic:
  mps: false
  mcs: false

uacAcc:
  normalClass: 0
  class11: false
  class12: false
  class13: false
  class14: false
  class15: false

# ─── PDU Sessions (Dual-Slice: Internet + IMS) ──────────────────
sessions:
  - type: 'IPv4'
    apn: 'internet'
    slice:
      sst: 1
      sd: 0xFFFFFF
  - type: 'IPv4'
    apn: 'ims'
    slice:
      sst: 1
      sd: 0xFFFFFF

# ─── Network Slicing ───────────────────────────────────────────
configured-nssai:
  - sst: 1
    sd: 0xFFFFFF

default-nssai:
  - sst: 1
    sd: 0xFFFFFF

# ─── Security Algorithms ───────────────────────────────────────
integrity:
  IA1: true    # SNOW 3G
  IA2: true    # AES
  IA3: true    # ZUC

ciphering:
  EA1: true    # SNOW 3G
  EA2: true    # AES
  EA3: true    # ZUC

# ─── Data Rate ──────────────────────────────────────────────────
integrityMaxRate:
  uplink: 'full'
  downlink: 'full'
