# UERANSIM gNodeB Configuration for Egypt Home Network (HPLMN 602/03, 602/04)
# Open Telecom Lab — Isolated Home RAN
# Reference: 3GPP TS 38.413 / TS 23.501

# PLMN Identity
mcc: '602'
mnc: '03'

# Supported PLMNs (Home PLMNs ONLY — 218/90 is NOT present)
plmnList:
  - mcc: '602'
    mnc: '03'
  - mcc: '602'
    mnc: '04'

# NR Cell Identity (Home Cell)
nci: '0x000000010'
idLength: 32
tac: 1

# Transport Layer Addresses
linkIp: 127.0.0.1     # gNB local bind for simulated radio link (Home UE search list)
ngapIp: 172.19.0.1     # N2 interface (SCTP source on host kind bridge)
gtpIp: 172.19.0.1      # N3 interface (GTP-U endpoint for UPF downlink)

# AMF Configuration (Home AMF ONLY — No association with VAMF)
amfConfigs:
  - address: 172.19.0.2
    port: 38412          # SCTP port for Home AMF (PLMNs 602/03, 602/04)

# Network Slice Support
slices:
  - sst: 1              # eMBB (Enhanced Mobile Broadband)
    sd: 0xffffff         # Default Slice Differentiator

# Stream handling
ignoreStreamIds: true
