# UERANSIM gNodeB Configuration for Open5GS
# Open Telecom Lab — v3.0 (Kubernetes / Kind & Host Networking)
# Reference: UERANSIM Wiki + 3GPP TS 38.413

# PLMN Identity (Standard 3GPP Test Network)
mcc: '001'
mnc: '01'

# NR Cell Identity
nci: '0x000000010'
idLength: 32
tac: 1

# Transport Layer Addresses
linkIp: 127.0.0.1     # gNB local bind for simulated radio link (UE search list)
ngapIp: 172.19.0.1     # N2 interface (SCTP source on host kind bridge)
gtpIp: 172.19.0.1      # N3 interface (GTP-U endpoint for UPF downlink)

# AMF Configuration (Target kind control-plane node IP)
amfConfigs:
  - address: 172.19.0.2
    port: 38412          # SCTP port for NGAP

# Network Slice Support
slices:
  - sst: 1              # eMBB (Enhanced Mobile Broadband)
    sd: 0xffffff         # Default Slice Differentiator

# Stream handling
ignoreStreamIds: true
